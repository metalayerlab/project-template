# The template's own CI: render every variant and run each one's checks.
name: Template CI

on:
  push:
    branches: [main, 'dev/**', 'feat/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    name: Render and check (${{ matrix.variant }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [service, service-min, cli, library]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0        # copier renders from git history and tags
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: '3.13'
          enable-cache: true
      - name: Install validators
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL -o "$HOME/.local/bin/hadolint" \
            https://github.com/hadolint/hadolint/releases/download/v2.15.1/hadolint-linux-x86_64
          chmod +x "$HOME/.local/bin/hadolint"
          curl -fsSL https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz \
            | tar -xz -C "$HOME/.local/bin" kubeconform
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Render, check, build and run the image
        env:
          CI: "true"
          GIT_AUTHOR_NAME: ci
          GIT_AUTHOR_EMAIL: ci@example.org
          GIT_COMMITTER_NAME: ci
          GIT_COMMITTER_EMAIL: ci@example.org
        run: uv run pytest -v -m '' -k "[${{ matrix.variant }}]"

  layers:
    name: Core/layer boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: '3.13'
      - name: No language tooling in core files; every layer complete
        run: uv run pytest -v tests/test_layers.py

  wiki:
    name: Template wiki
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: The template's own wiki meets its own standard (strict)
        run: python3 template/scripts/check-wiki.py --wiki docs/wiki --strict
      - uses: DavidAnson/markdownlint-cli2-action@696eb3f2509270d7b882d2aa68347bc676e7af34 # v25.0.0
        with:
          config: template/.markdownlint-cli2.yaml
          globs: |
            docs/wiki/*.md
            *.md
            !CHANGELOG.md

  workflows:
    name: Workflow lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12 -color
