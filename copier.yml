# project-template: start a new metalayerlab project.
#
#   uvx copier copy --trust gh:metalayerlab/project-template my-project
#   cd my-project && uvx copier update --trust --skip-tasks && sh scripts/bootstrap.sh   # later: template fixes
#
# See the wiki: Quick-Start and Answering-the-Questions.

_min_copier_version: "9.6.0"
_subdirectory: template
_templates_suffix: .jinja
_answers_file: .copier-answers.yml

# GitHub Actions uses ${{ }}, so Jinja uses [[ ]] / [% %] instead and the
# workflows need no {% raw %} blocks.
_envops:
  variable_start_string: "[["
  variable_end_string: "]]"
  block_start_string: "[%"
  block_end_string: "%]"
  comment_start_string: "[#!"
  comment_end_string: "!#]"
  keep_trailing_newline: true
  trim_blocks: true
  lstrip_blocks: true

# Written once, then the project's: `copier update` never touches them again.
# Template-owned files (workflows, scripts/check-wiki.py, docs/wiki/.standard.toml,
# docs/wiki/Release-Process.md, ...) are not listed, so updates reach them.
_skip_if_exists:
  - CHANGELOG.md
  - .release-please-manifest.json
  - TODO.md
  - .github/repository.toml
  - "src/**"
  - scripts/check.sh
  - version.txt
  - "tests/**"
  - "contrib/*.example.yaml"
  - contrib/system-packages.txt
  - docker/nginx-site.conf
  - public/config.json
  - index.html
  - docs/design/README.md
  - docs/wiki/Home.md
  - docs/wiki/Introduction.md
  - docs/wiki/Quick-Start.md
  - docs/wiki/In-Depth-Configuration.md
  - docs/wiki/Architecture-Internals.md
  - docs/wiki/Security.md
  - docs/wiki/Testing-Guide.md
  - docs/wiki/Contributing.md
  - docs/wiki/Troubleshooting.md
  - docs/wiki/Frequently-Asked-Questions.md
  - docs/wiki/HTTP-API-Reference.md
  - docs/wiki/CLI-Reference.md
  - docs/wiki/Deployment.md
  - docs/wiki/_Sidebar.md
  - docs/wiki/_Footer.md
  # A brain's README.md, and its vault's notes and shared settings, are its own (design record 0016).
  - "[[ 'README.md' if kind == 'brain' else '' ]]"
  - "[[ (('' if vault_dir == '.' else vault_dir ~ '/') ~ '🏠 Home.md') if language == 'obsidian' else '' ]]"
  - "[[ (('' if vault_dir == '.' else vault_dir ~ '/') ~ '📐 Conventions.md') if language == 'obsidian' else '' ]]"
  - "[[ (('' if vault_dir == '.' else vault_dir ~ '/') ~ '_attachments/**') if language == 'obsidian' else '' ]]"
  - "[[ (('' if vault_dir == '.' else vault_dir ~ '/') ~ '.obsidian/app.json') if language == 'obsidian' else '' ]]"
  - "[[ (('' if vault_dir == '.' else vault_dir ~ '/') ~ '.obsidian/templates.json') if language == 'obsidian' else '' ]]"
  # The list a brain follows is its own; the template only seeds it (design record 0019).
  - "[[ (('' if vault_dir == '.' else vault_dir ~ '/') ~ '🛰️ Subscriptions.md') if language == 'obsidian' else '' ]]"

# A brain keeps the agent guard rails and the secret scan, and drops releases,
# the wiki and markdownlint: its vault is its wiki (design records 0015 and 0016).
_exclude:
  - |
    [% if kind == 'brain' %]
    /CHANGELOG.md
    /CONTRIBUTING.md
    /SECURITY.md
    /TODO.md
    /version.txt
    /release-please-config.json
    /.release-please-manifest.json
    /.markdownlint-cli2.yaml
    /contrib
    /docs
    /scripts/check-wiki.py
    /.github/workflows/release-please.yml
    /.github/workflows/pr-title.yml
    /.github/workflows/wiki.yml
    /.github/ISSUE_TEMPLATE/bug_report.yml
    /.github/ISSUE_TEMPLATE/feature_request.yml
    [% endif %]

# Lock dependencies, fill the generated wiki sections, git init. Needs --trust;
# without it, run scripts/bootstrap.sh yourself.
# Only on copy: `copier update` runs tasks before it reapplies the project's
# edits, so a failing task there silently drops them (#82). After an update, run
# scripts/bootstrap.sh yourself (template-update.yml does).
_tasks:
  - command: "sh scripts/bootstrap.sh"
    when: "[[ _copier_operation == 'copy' ]]"

# Updating from a version whose bootstrap still ran on update: Copier's copy of
# the old version has a lock file and the new one doesn't, so the update deletes
# the project's. Restore it. `when` is explicit: older Copier defaults it
# with {{ }} delimiters.
_migrations:
  - version: "0.1.21"
    when: "[[ _stage == 'after' ]]"
    command: >-
      for f in uv.lock package-lock.json; do
      if [ ! -e "$f" ] && git cat-file -e "HEAD:$f" 2>/dev/null;
      then git checkout HEAD -- "$f"; fi; done

_message_after_copy: |
  [[ project_name ]] is ready.

  Next:
    cd [[ _copier_conf.dst_path ]]
    sh scripts/bootstrap.sh            # if you didn't pass --trust
    git add -A && git commit -m "chore: initial commit from project-template"

  Then read AGENTS.md (it is what your AI assistant reads too) and
  docs/ai/prompts.md for the kick-off prompt. Wiki: docs/wiki/.

_message_after_update: |
  Next: resolve any <<<<<<< markers, then run sh scripts/bootstrap.sh
  (lock file, generated wiki sections), review git diff and commit.

# ---------------------------------------------------------------- questions

language:
  type: str
  help: Language layer (more layers come later; see layers/README.md)
  choices:
    Python: python
    "TypeScript: Node.js and npm": typescript
    # A notes repository: the vault is the wiki, design records are notes (design record 0016).
    "Obsidian: a vault of notes (no build, release or image)": obsidian
    "None: core only (no build, tests or image)": none
  default: python

project_name:
  type: str
  help: Project name, kebab-case (repo, image and CLI name)
  validator: >-
    [% if not (project_name | regex_search('^[a-z][a-z0-9]*(-[a-z0-9]+)*$')) %]
    Use lower-case kebab-case: my-project
    [% endif %]

package_name:
  type: str
  help: Python package name (snake_case)
  default: "[[ project_name | replace('-', '_') ]]"
  when: "[[ language == 'python' ]]"
  validator: >-
    [% if not (package_name | regex_search('^[a-z][a-z0-9_]*$')) %]
    Use snake_case: my_project
    [% endif %]

description:
  type: str
  help: One-line description (README, package manifest, wiki footer)
  validator: "[% if not description %]Required[% endif %]"

github_owner:
  type: str
  help: GitHub owner (organisation or user)
  default: metalayerlab

kind:
  type: str
  help: What it is
  choices:
    "service: long-running, HTTP API (FastAPI / Fastify), health endpoints":
      value: service
      validator: "[% if language in ['none', 'obsidian'] %]Needs a language layer for code[% endif %]"
    "cli: command-line tool (Typer / commander)":
      value: cli
      validator: "[% if language in ['none', 'obsidian'] %]Needs a language layer for code[% endif %]"
    "library: importable package only":
      value: library
      validator: "[% if language in ['none', 'obsidian'] %]Needs a language layer for code[% endif %]"
    # A Vite + React single-page app in an nginx image (design record 0014).
    "web: single-page app (Vite + React), served by nginx (language: typescript only)":
      value: web
      validator: "[% if language != 'typescript' %]Only with language: typescript[% endif %]"
    # What `language: none` gets: no generated code at all (design record 0008).
    "other: no language layer (language: none only)":
      value: other
      validator: "[% if language != 'none' %]Only with language: none[% endif %]"
    # A notes repository, never asked: language: obsidian sets it (design record 0016). It is a real
    # choice because Copier checks a hidden question's default against the choices, and still applies
    # a `-d kind=...`, so every other choice rejects obsidian.
    "brain: a notes repository (language: obsidian only)":
      value: brain
      validator: "[% if language != 'obsidian' %]Only with language: obsidian[% endif %]"
  # Not asked for obsidian: a vault is a brain, the notes repository shape (design record 0016).
  default: "[[ 'other' if language == 'none' else 'brain' if language == 'obsidian' else 'service' ]]"
  when: "[[ language != 'obsidian' ]]"

vault_dir:
  type: str
  help: The vault's folder, relative to the repository root ("." for the root itself)
  default: knowledge
  when: "[[ language == 'obsidian' ]]"
  validator: >-
    [% if not (vault_dir | regex_search('^(\\.|[A-Za-z0-9_][A-Za-z0-9 _-]*)$')) %]
    One folder name, or "." for the repository root
    [% endif %]

# A daily Claude Code run that keeps notes current with what they follow, in one PR (design records 0018, 0019).
brain_pull:
  type: bool
  help: Add the Brain pull workflow? Daily, Claude Code updates the notes whose `repos:` property names a GitHub repository that changed (or the parts of it a `🛰️ Subscriptions` note follows), in one PR for review. Needs the CLAUDE_CODE_OAUTH_TOKEN secret and a repository setting (Quick-Start in the wiki)
  default: false
  when: "[[ language == 'obsidian' ]]"

python_version:
  type: str
  help: Minimum Python version (Docker base image and the first CI matrix entry)
  choices: ["3.13", "3.14"]
  default: "3.13"
  when: "[[ language == 'python' ]]"

node_version:
  type: str
  help: Minimum Node.js version (Docker base image and the first CI matrix entry)
  choices: ["24", "26"]
  default: "24"
  when: "[[ language == 'typescript' ]]"

port:
  type: int
  help: HTTP port the service (or a web app's nginx) listens on
  default: 8080
  when: "[[ kind in ['service', 'web'] ]]"

extra_ports:
  type: yaml
  help: Other TCP ports the service listens on, besides `port` (for example [3128]). Each is exposed by the image and published by the contrib manifests.
  default: "[]"
  when: "[[ kind == 'service' ]]"
  validator: >-
    [% if extra_ports is string or extra_ports is not sequence %]
    A list of port numbers: [3128]
    [% elif extra_ports | reject('integer') | list or extra_ports | select('lt', 1) | list or extra_ports | select('gt', 65535) | list %]
    Each port is a number from 1 to 65535
    [% elif extra_ports | unique | list | length != extra_ports | length %]
    A port is listed twice
    [% elif port in extra_ports %]
    [[ port ]] is already `port`
    [% endif %]

health_path:
  type: str
  help: Liveness endpoint (Docker HEALTHCHECK, k8s probes, CI smoke test)
  default: /healthz
  when: "[[ kind in ['service', 'web'] ]]"
  validator: "[% if not health_path.startswith('/') %]Must start with /[% endif %]"

container_image:
  type: bool
  help: Build and publish a container image to GHCR?
  default: "[[ kind not in ['library', 'other', 'brain'] ]]"
  when: "[[ kind not in ['library', 'other', 'brain'] ]]"

multi_arch:
  type: bool
  help: Build linux/arm64 as well as linux/amd64?
  default: true
  when: "[[ container_image ]]"

image_extras:
  type: yaml
  help: Optional extras (pyproject's [project.optional-dependencies]) the image installs, for example [fuse], or ["*"] for all. CI's tests don't install them.
  default: "[]"
  when: "[[ container_image and language == 'python' ]]"
  validator: >-
    [% if image_extras is string or image_extras is not sequence %]
    A list of extra names: [fuse]
    [% elif image_extras | reject('string') | list or '' in image_extras %]
    Each extra is a name
    [% elif '*' in image_extras and image_extras | length > 1 %]
    "*" (all extras) stands alone
    [% elif image_extras | reject('eq', '*') | map('lower') | map('trim', 'abcdefghijklmnopqrstuvwxyz0123456789._-') | select | list
        or image_extras | reject('eq', '*') | map('first') | map('lower') | reject('in', 'abcdefghijklmnopqrstuvwxyz0123456789') | list %]
    Names start with a letter or digit and use letters, digits, ".", "_" and "-"
    [% elif image_extras | unique | list | length != image_extras | length %]
    An extra is listed twice
    [% endif %]

contrib:
  type: str
  help: Deployment manifests to include under contrib/
  multiselect: true
  choices:
    "docker: compose.yml": docker
    "k8s: kustomize base (Flux-friendly)": k8s
    # A web app's static files on a host are that host's nginx's job (design record 0014).
    "systemd: hardened unit + sysusers":
      value: systemd
      validator: "[% if kind != 'service' %]Only with kind: service[% endif %]"
  default: "[[ ['docker', 'k8s', 'systemd'] if kind == 'service' else ['docker', 'k8s'] if kind == 'web' else [] ]]"
  when: "[[ kind in ['service', 'web'] ]]"
  validator: >-
    [% if not container_image and ('docker' in contrib or 'k8s' in contrib) %]
    docker and k8s need a container image
    [% endif %]

puid_pgid:
  type: bool
  help: Container starts as root to chown its state directory, then drops to PUID:PGID? No (default) = runs as uid 1000.
  default: false
  when: "[[ container_image and kind == 'service' ]]"

timezone:
  type: str
  help: Default TZ in compose and k8s manifests
  default: Europe/London
  when: "[[ kind == 'service' ]]"

code_owners:
  type: str
  help: CODEOWNERS for every path (a team or users; required reviewers)
  default: "@[[ github_owner ]]/maintainers"

dependabot_automerge:
  type: str
  help: Queue auto-merge on Dependabot PRs, so a code owner's approval merges them once checks pass? Bigger updates get no auto-merge.
  choices:
    "off: a human reviews every update": "off"
    "patch updates": patch
    "patch and minor updates": minor
  default: "off"

license:
  type: str
  help: Licence
  choices:
    Unlicense (public domain): Unlicense
    MIT: MIT
    Apache-2.0: Apache-2.0
    Proprietary (all rights reserved): Proprietary
  default: "[[ 'Proprietary' if kind == 'brain' else 'Unlicense' ]]"

copyright_holder:
  type: str
  help: Copyright holder (MIT / Apache / Proprietary)
  default: "[[ github_owner ]]"
  when: "[[ license != 'Unlicense' ]]"

personal_data_guard:
  type: bool
  help: Add the personal-data guard (fails CI on public IPs / denylisted strings in tracked files)?
  default: false

# An opt-in CI job for the integration tests (design record 0017).
integration_ci:
  type: bool
  help: Add a CI job that runs the integration tests (RUN_INTEGRATION=1) with contrib/system-packages.txt's build and runtime packages? It fails if no test runs or one is skipped.
  default: false
  when: "[[ language == 'python' ]]"
  validator: "[% if integration_ci and language != 'python' %]Only with language: python[% endif %]"

integration_extras:
  type: yaml
  help: Optional extras (pyproject's [project.optional-dependencies]) the integration job installs, for example [fuse], or ["*"] for all.
  default: "[]"
  when: "[[ integration_ci ]]"
  validator: >-
    [% if integration_extras is string or integration_extras is not sequence %]
    A list of extra names: [fuse]
    [% elif integration_extras | reject('string') | list or '' in integration_extras %]
    Each extra is a name
    [% elif '*' in integration_extras and integration_extras | length > 1 %]
    "*" (all extras) stands alone
    [% elif integration_extras | reject('eq', '*') | map('lower') | map('trim', 'abcdefghijklmnopqrstuvwxyz0123456789._-') | select | list
        or integration_extras | reject('eq', '*') | map('first') | map('lower') | reject('in', 'abcdefghijklmnopqrstuvwxyz0123456789') | list %]
    Names start with a letter or digit and use letters, digits, ".", "_" and "-"
    [% elif integration_extras | unique | list | length != integration_extras | length %]
    An extra is listed twice
    [% elif integration_extras and not integration_ci %]
    Only with integration_ci
    [% endif %]

# ------------------------------------------------- derived (never asked)

env_prefix:
  type: str
  default: "[[ (package_name if language == 'python' else project_name | replace('-', '_')) | upper ]]_"
  when: false

image:
  type: str
  default: "ghcr.io/[[ github_owner ]]/[[ project_name ]]"
  when: false

repo_url:
  type: str
  default: "https://github.com/[[ github_owner ]]/[[ project_name ]]"
  when: false

has_cli:
  type: bool
  default: "[[ kind in ['service', 'cli'] ]]"
  when: false

copyright_year:
  type: str
  default: "[[ '%Y' | strftime ]]"
  when: false
